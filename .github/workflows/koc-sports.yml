# .github/workflows/koc-sports.yml
#
# Runs the KoC sports checker every 30 minutes. It posts:
#   Monday 9 AM ET  - preview of the week's matchups
#   Day before game - individual game preview
#   Game end        - final score
#   Sunday 10 PM ET - recap of the week's results
# Previews are sent the day before a game, so timing is not urgent;
# 30 minutes is frequent enough for final scores too.
#
# SETUP: Settings -> Secrets and variables -> Actions -> New repository secret
#   Name:  DISCORD_WEBHOOK_URL
#   Value: your Discord webhook URL
#
# NOTE: checkout@v5 and cache@v5 run on Node 24 natively, so no
# FORCE_JAVASCRIPT_ACTIONS_TO_NODE24 workaround is needed.
# No setup-python step either — ubuntu-latest ships with Python 3.12
# and check.py uses only the standard library.

name: KoC Sports Alerts

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

# Prevents overlapping runs from racing on the same cache
concurrency:
  group: koc-sports
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Restore alert state
        uses: actions/cache/restore@v5
        with:
          path: state.json
          key: koc-state

      - name: Verify required files are present
        run: |
          echo "Repository root contents:"
          ls -la
          missing=0
          for f in check.py schools.json; do
            if [ ! -f "$f" ]; then
              echo "::error::Missing required file '$f' at the repository root."
              missing=1
            fi
          done
          if [ "$missing" -eq 1 ]; then
            echo ""
            echo "Both check.py and schools.json must sit at the TOP level of the repo,"
            echo "in the same place as the .github folder — not inside a subfolder."
            echo "Any .py or .json files found anywhere in the repo:"
            find . -path ./.git -prune -o \( -name '*.py' -o -name '*.json' \) -print
            exit 1
          fi
          echo "All required files found."

      - name: Run KoC sports checker
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          # Optional — only needed for automatic custom-emoji lookup.
          # Leave unset to use manual "emoji" fields in schools.json instead.
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
        run: python check.py

      # Delete then re-save under the same key, so only ONE cache entry ever
      # exists instead of accumulating hundreds. On the very first run there is
      # nothing to delete, so failure here is expected and ignored.
      - name: Delete old state cache
        if: always()
        continue-on-error: true
        run: gh cache delete koc-state --repo ${{ github.repository }} || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Save alert state
        if: hashFiles('state.json') != ''
        uses: actions/cache/save@v5
        with:
          path: state.json
          key: koc-state
