# .github/workflows/koc-sports.yml
#
# Runs the KoC sports checker every 30 minutes. It posts:
#   Monday 9 AM ET  - preview of the week's matchups
#   Day before game - individual game preview
#   Game end        - final score
#   Sunday 10 PM ET - recap of the week's results
# Previews are sent the day before a game, so timing is not urgent;
# 30 minutes is frequent enough for final scores too.
#
# SETUP: Settings -> Secrets and variables -> Actions -> New repository secret
#   Name:  DISCORD_WEBHOOK_URL
#   Value: your Discord webhook URL
#
# NOTE: checkout@v5 and cache@v5 run on Node 24 natively, so no
# FORCE_JAVASCRIPT_ACTIONS_TO_NODE24 workaround is needed.
# No setup-python step either — ubuntu-latest ships with Python 3.12
# and check.py uses only the standard library.

name: KoC Sports Alerts

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

# Prevents overlapping runs from racing on the same cache
concurrency:
  group: koc-sports
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Restore alert state
        uses: actions/cache/restore@v5
        with:
          path: state.json
          key: koc-state

      - name: Locate bot files
        id: locate
        run: |
          echo "Repository root contents:"
          ls -la
          # check.py is normally at the repo root, but find it wherever it is
          SCRIPT=$(find . -path ./.git -prune -o -name 'check.py' -print | head -n 1)
          if [ -z "$SCRIPT" ]; then
            echo "::error::check.py not found anywhere in the repository."
            echo "Upload check.py and schools.json to the top level of the repo."
            exit 1
          fi
          DIR=$(dirname "$SCRIPT")
          if [ ! -f "$DIR/schools.json" ]; then
            echo "::error::Found check.py at $SCRIPT but no schools.json beside it."
            echo "Both files must sit in the SAME folder."
            find . -path ./.git -prune -o -name 'schools.json' -print
            exit 1
          fi
          echo "script=$SCRIPT" >> "$GITHUB_OUTPUT"
          echo "Using $SCRIPT"
          if [ "$DIR" != "." ]; then
            echo "::warning::check.py is in '$DIR', not the repo root. It works, but the root is the tidier home for it."
          fi

      - name: Check required secret
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "::error::Repository secret DISCORD_WEBHOOK_URL is empty or not set."
            echo ""
            echo "Fix: Settings -> Secrets and variables -> Actions -> Repository secrets"
            echo "  Name must be exactly: DISCORD_WEBHOOK_URL"
            echo "  Value: https://discord.com/api/webhooks/..."
            echo ""
            echo "Note: secrets belong to ONE repository. If you renamed or recreated"
            echo "this repo, the secret must be added again here."
            echo "Also check it is a *Repository* secret, not an *Environment* secret."
            exit 1
          fi
          case "$DISCORD_WEBHOOK_URL" in
            https://discord.com/api/webhooks/*|https://discordapp.com/api/webhooks/*)
              echo "DISCORD_WEBHOOK_URL is set and looks like a Discord webhook URL." ;;
            *)
              echo "::warning::Secret is set but does not start with https://discord.com/api/webhooks/ — double-check the value was pasted in full." ;;
          esac

      - name: Run KoC sports checker
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          # Optional — only needed for automatic custom-emoji lookup.
          # Leave unset to use manual "emoji" fields in schools.json instead.
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
          # Keep state.json at the workspace root regardless of where check.py
          # lives, so the cache path below always matches.
          KOC_STATE_FILE: ${{ github.workspace }}/state.json
        run: python "${{ steps.locate.outputs.script }}"

      # Delete then re-save under the same key, so only ONE cache entry ever
      # exists instead of accumulating hundreds. On the very first run there is
      # nothing to delete, so failure here is expected and ignored.
      - name: Delete old state cache
        if: always()
        continue-on-error: true
        run: gh cache delete koc-state --repo ${{ github.repository }} || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Save alert state
        if: hashFiles('state.json') != ''
        uses: actions/cache/save@v5
        with:
          path: state.json
          key: koc-state
