# .github/workflows/koc-sports.yml
#
# Runs the KoC sports checker every 30 minutes.
# Previews are sent the day before a game, so timing is not urgent;
# 30 minutes is frequent enough for final scores too.
#
# SETUP: Settings -> Secrets and variables -> Actions -> New repository secret
#   Name:  DISCORD_WEBHOOK_URL
#   Value: your Discord webhook URL
#
# NOTE: checkout@v5 and cache@v5 run on Node 24 natively, so no
# FORCE_JAVASCRIPT_ACTIONS_TO_NODE24 workaround is needed.
# No setup-python step either — ubuntu-latest ships with Python 3.12
# and check.py uses only the standard library.

name: KoC Sports Alerts

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

# Prevents overlapping runs from racing on the same cache
concurrency:
  group: koc-sports
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Restore alert state
        uses: actions/cache/restore@v5
        with:
          path: state.json
          key: koc-state

      - name: Run KoC sports checker
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python check.py

      # Delete then re-save under the same key, so only ONE cache entry
      # ever exists instead of accumulating hundreds.
      - name: Delete old state cache
        if: always()
        continue-on-error: true
        run: gh cache delete koc-state --repo ${{ github.repository }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Save alert state
        if: always()
        uses: actions/cache/save@v5
        with:
          path: state.json
          key: koc-state
